<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet</title>
    <style>
        /* Base system-default styles (Light Mode default) */
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --secondary-text: #5f6368;
            --link-color: #1a73e8;
        }

        /* Modern Chrome Dark Mode adaptation */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --secondary-text: #9aa0a6;
                --link-color: #8ab4f8;
            }
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--secondary-text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        #main-container {
            width: 100%;
            max-width: 600px;
            padding: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            color: var(--text-color);
            margin-top: 0;
            margin-bottom: 16px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 8px 0;
        }

        ul {
            margin: 0 0 24px 0;
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.8;
        }

        li {
            margin-bottom: 4px;
        }

        .error-code {
            font-size: 12px;
            color: var(--secondary-text);
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Subtle button styling mimicking Chrome's diagnostics layout */
        .blue-link {
            color: var(--link-color);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .blue-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div id="main-container">
    <!-- Main Error Heading -->
    <h1>No internet</h1>
    
    <!-- Diagnostics / Troubleshooting guidelines -->
    <p>Try:</p>
    <ul>
        <li>Checking the network cables, modem, and router</li>
        <li>Reconnecting to Wi-Fi</li>
        <li><a class="blue-link" onclick="window.location.reload();">Running Network Diagnostics</a></li>
    </ul>
    
    <!-- Technical Error Code -->
    <div class="error-code">ERR_INTERNET_DISCONNECTED</div>
</div>

</body>
</html>

        .modal-content input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255, 255, 255, 0.1); padding: 16px; margin-top: 5px; border-radius: 16px; color: white; font-size: 1.2rem; box-sizing: border-box; text-align: center; transition: border 0.3s ease; font-weight: 600; }
        .modal-content input:focus { outline: none; border-color: var(--primary); }
        .modal-result { margin: 25px 0; padding: 20px; background: linear-gradient(145deg, rgba(56, 189, 248, 0.1), rgba(0,0,0,0)); border-radius: 20px; border: 1px dashed rgba(56, 189, 248, 0.3); }
        #finalDiscount { font-size: 2.2rem; font-weight: 800; color: var(--success); text-shadow: 0 0 15px rgba(255, 238, 0, 0.3); }
        .modal-copy-zone { height: 60px; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-top: 10px; background: var(--primary); color: var(--bg); border-radius: 16px; font-weight: 800; letter-spacing: 1px; transition: all 0.2s ease; }
        .modal-copy-zone:hover { transform: scale(1.02); background: #6feeff; }
        .modal-copy-zone.success-state { background: var(--success); }
        .modal-close-btn { margin-top: 20px; background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 0.8rem; font-weight: 600; text-decoration: underline; }
    </style>
</head>

        <div class="item-row" data-val="HM-PARACETAMOL"><span class="text-content">HM-PARACETAMOL</span></div>

    <div class="bottom-zone" id="copyZone" onclick="copyFocusedItem()">
        <button class="btn-main-copy" id="magnetBtn"></button>

        <div class="modal-content" id="modalBox" onclick="event.stopPropagation()">

            <div class="input-group">
                <label>HOSPITAL CHARGES</label>
                <input id="hospCharges" type="number" placeholder="0.00" oninput="calcSr()">

                <label>CASE RATE (PHIC)</label>

    <div class="modal-overlay" id="listModal" onclick="closeOutside(event, 'listModal')">

            <button class="modal-close-btn" onclick="toggleModal('listModal', false)">Dismiss</button>
        </div>

    <script>
        let textTimeout;
        let currentFocusedIndex = 0;
        const allRows = document.querySelectorAll('.item-row');
        const highlighter = document.getElementById('highlighter');
        const container = document.getElementById('mainContainer');
        const magnetBtn = document.getElementById('magnetBtn');
        const modalCopyBtn = document.getElementById('modalCopyBtn');
                
        const extraItems = {
            lab: ["CHEMISTRY: TRIGLYCERIDES", "CHEMISTRY: HDL", "CHEMISTRY: DIRECT LDL", "CHEMISTRY: ALT"],
            supply: ["NEBULIZING KIT COMPLETE SET W/T-PIECE & MOUTHPIECE", "NEBULIZING KIT WITH MASK (PEDIA)", "COTTON BALLS, 3'S/PACK", "OXYGEN CANNULA (ADULT)", "OXYGEN CANNULA (PEDIA)", "SYRINGE DISPOSABLE 1 CC", "SYRINGE DISPOSABLE ( 5.0 CC)"],
            others: ["HM-AMLODIPINE", "HM-OMEPRAZOLE", "HM-COLCHICINE", "HM-SAMBONG", "HM-CEFIXIME", "HM-ACETYLCYSTEINE", "MEDICAL OXYGEN", "HBsAg", "DENGUE DUO", "SERUM ELECTROLYTES", "FECALYSIS", "H-PYLORI", "ECG", "TYPHIDOT", "TSH", "T3", "T4", "FT3", "FT4"]
        };

        window.onload = () => {
            setTimeout(() => updateFocus(0), 100);
            allRows.forEach((row, idx) => {
                row.addEventListener('click', () => executeCopy(row, row.getAttribute('data-val'), idx));
            });
            lucide.createIcons();
            startIdle();
        };

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) {
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.classList.add('active');
                    if (id === 'srModal') document.getElementById('hospCharges').focus();
                }, 10);
            } else {
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                    if(id === 'srModal') resetCalculator();
                }, 400); 
            }
        }

        function closeOutside(e, id) { if (e.target.id === id) toggleModal(id, false); }

        function resetCalculator() {
            document.getElementById('hospCharges').value = "";
            document.getElementById('caseRate').value = "";
            document.getElementById('finalDiscount').innerText = "0.00";
        }

        function calcSr() {
            const charges = parseFloat(document.getElementById('hospCharges').value) || 0;
            const rate = parseFloat(document.getElementById('caseRate').value) || 0;
            const discount = charges - ((charges * 0.20) + rate);
            document.getElementById('finalDiscount').innerText = discount.toFixed(2);
        }

        function copyModalValue() {
            const val = document.getElementById('finalDiscount').innerText;
            navigator.clipboard.writeText(val).then(() => {
                modalCopyBtn.innerText = "COPIED!";
                modalCopyBtn.classList.add('success-state');
                setTimeout(() => {
                    modalCopyBtn.innerText = "COPY RESULT";
                    modalCopyBtn.classList.remove('success-state');
                    toggleModal('srModal', false);
                }, 600);
            });
        }

        function openList(cat) {
            const listCont = document.getElementById('listContainer');
            listCont.innerHTML = '';
            document.getElementById('listTitle').innerText = cat.toUpperCase();
            extraItems[cat].forEach(text => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerText = text;
                div.onclick = () => {
                    navigator.clipboard.writeText(text);
                    toggleModal('listModal', false);
                    flashMagnet();
                };
                listCont.appendChild(div);
            });
            toggleModal('listModal', true);
        }

        function flashMagnet() {
            magnetBtn.innerText = "COPIED!";
            magnetBtn.classList.add('success-state');
            document.body.classList.add('copy-flash');
            setTimeout(() => {
                magnetBtn.innerText = "";
                magnetBtn.classList.remove('success-state');
                document.body.classList.remove('copy-flash');
            }, 600);
        }

        /* Magnet Logic */
        document.addEventListener('mousemove', (e) => {
            const threshold = window.innerHeight * 0.75;
            if (e.clientY > threshold) {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight - (window.innerHeight * 0.125);
                const pullX = (e.clientX - centerX) * 0.3;
                const pullY = (e.clientY - centerY) * 0.4;
                magnetBtn.style.transform = `translate(${pullX}px, ${pullY}px)`;
            } else { resetMagnet(); }
        });

        function resetMagnet() { magnetBtn.style.transform = `translate(0, 0)`; }

        function updateFocus(index) {
            currentFocusedIndex = index;
            const targetRow = allRows[index];
            if(!targetRow) return;
            const rect = targetRow.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            highlighter.style.opacity = "1";
            highlighter.style.top = (rect.top - containerRect.top) + "px";
            highlighter.style.height = rect.height + "px";
            targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function executeCopy(row, text, index) {
            updateFocus(index);
            navigator.clipboard.writeText(text).then(() => {
                document.querySelectorAll('.text-content').forEach(el => el.classList.remove('text-active'));
                clearTimeout(textTimeout);
                const textElement = row.querySelector('.text-content');
                textElement.classList.add('text-active');
                flashMagnet();

                let nextIdx = (index + 1) % allRows.length;
                // Specific Item Logic
                if(row.innerText.includes("IV CATHETER G. 20")) nextIdx = Array.from(allRows).findIndex(r => r.innerText.includes("MACROSET"));
                if(row.innerText.includes("IV CATHETER G. 24")) nextIdx = Array.from(allRows).findIndex(r => r.innerText.includes("MICROSET"));
                                
                setTimeout(() => updateFocus(nextIdx), 400);
                textTimeout = setTimeout(() => textElement.classList.remove('text-active'), 8000);
            });
        }

        function copyFocusedItem() {
            const activeRow = allRows[currentFocusedIndex];
            executeCopy(activeRow, activeRow.getAttribute('data-val'), currentFocusedIndex);
        }
        function nextFocus() { updateFocus((currentFocusedIndex + 1) % allRows.length); }
        function resetFocus() { const idx = Array.from(allRows).indexOf(document.getElementById('reset-target')); updateFocus(idx); }

        /* Idle State */
        let idleTimer;
        function startIdle() { magnetBtn.classList.add('idle'); }
        function stopIdle() { magnetBtn.classList.remove('idle'); }
        function resetIdle() { stopIdle(); clearTimeout(idleTimer); idleTimer = setTimeout(startIdle, 2000); }
        ['mousemove', 'click', 'scroll'].forEach(e => document.addEventListener(e, resetIdle));

    </script>
</body>
</html>
