<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSOA - Pro Custom Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-hue: 27;
            --bg-hue: 20;
            --surface-hue: 20;
            --primary: hsl(var(--primary-hue), 100%, 50%);
            --bg: hsl(var(--bg-hue), 30%, 6%);
            --surface: hsl(var(--surface-hue), 40%, 4%);
            --success: #d0ff00;
            --text-main: #fff7ed;
            --glass: hsla(var(--primary-hue), 100%, 50%, 0.15);
            --modal-bg: hsla(var(--bg-hue), 40%, 4%, 0.98);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: hsla(var(--primary-hue), 100%, 50%, 0.2); border-radius: 10px; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 100px 10px 25vh 10px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        body.copy-flash { background-color: hsla(var(--primary-hue), 100%, 50%, 0.2); }

        .profile-pill {
            position: fixed; top: 20px; left: 20px; height: 46px;
            background: var(--surface); border: 1px solid var(--glass);
            border-radius: 23px; display: flex; align-items: center;
            padding: 0 15px 0 5px; gap: 10px; z-index: 3000;
            backdrop-filter: blur(10px); cursor: pointer;
            transition: transform 0.2s ease;
        }
        .profile-pill:hover { transform: scale(1.02); border-color: var(--primary); }
        .profile-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #333; }
        .profile-name { font-size: 0.85rem; font-weight: 600; color: var(--primary); }

        .top-nav { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 3000; }
        .top-btn { 
            width: 46px; height: 46px; background: var(--surface); 
            border: 1px solid var(--glass); border-radius: 14px; 
            color: white; backdrop-filter: blur(10px); cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .top-btn:hover { background: var(--primary); color: #000; transform: translateY(-2px); }

        .container { 
            position: relative; width: 100%; max-width: 400px; 
            background: var(--surface); padding: 20px; border-radius: 28px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); 
            border: 1px solid var(--glass);
        }

        #highlighter { 
            position: absolute; left: 8px; right: 8px; 
            border: 2px solid var(--primary); background-color: var(--glass); 
            border-radius: 12px; pointer-events: none; 
            transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
            z-index: 1; opacity: 0;
        }

        h2 { font-size: 0.7rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.15em; margin: 30px 0 10px 10px; opacity: 0.6; }
        .item-row { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 14px; margin: 4px 0; cursor: pointer; border-radius: 12px; transition: all 0.3s ease; }
        .item-row:hover { background: rgba(255, 255, 255, 0.03); }
        .text-content { font-size: 0.95rem; font-weight: 500; transition: color 0.3s ease; }
        .text-active { color: var(--success); text-shadow: 0 0 12px var(--success); }

        .add-btn-circle { width: 38px; height: 38px; border-radius: 50%; background: var(--glass); border: 1px dashed var(--primary); color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 10px 0 20px 10px; transition: all 0.2s ease; }
        .add-btn-circle:hover { background: var(--primary); color: #000; transform: scale(1.1); }

        .bottom-zone { position: fixed; bottom: 0; left: 0; width: 100%; height: 25vh; z-index: 2000; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-main-copy {
            width: 190px; height: 100px; border: none; border-radius: 40px;
            font-weight: 800; font-size: 1rem; text-transform: uppercase;
            letter-spacing: 2px; position: relative; overflow: hidden;
            background-color: var(--surface); color: white;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            background-image: url('https://sklepagatesting.github.io/resources/Images/mclaren.png');
            background-size: cover; background-position: center;
            filter: drop-shadow(0 0 15px var(--glass));
            display: flex; align-items: center; justify-content: center;
        }
        .btn-main-copy.success-state { background-image: none !important; background-color: var(--success); color: #000; }

        @keyframes idleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .idle { animation: idleFloat 3s ease-in-out infinite; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0); backdrop-filter: blur(0px);
            display: none; justify-content: center; align-items: center; z-index: 4000;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }

        .modal-content {
            background: var(--modal-bg); width: 90%; max-width: 380px; padding: 30px; border-radius: 32px;
            border: 1px solid var(--glass); position: relative; text-align: center;
            opacity: 0; transform: scale(0.8) translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 85vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { opacity: 1; transform: scale(1) translateY(0); }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 0.65rem; color: var(--primary); margin-left: 10px; font-weight: 800; display: block; margin-bottom: 5px; }
        .modal-content input { width: 100%; background: #000; border: 1px solid #222; padding: 14px; border-radius: 16px; color: white; font-size: 1.1rem; box-sizing: border-box; text-align: center; font-weight: 700; outline: none; }
        
        .slider-wrap { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-top: 5px; }
        .color-slider { width: 100%; accent-color: var(--primary); }

        .img-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .img-choice { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 2px solid transparent; cursor: pointer; object-fit: contain; background: #0a0a0a; transition: 0.2s; }
        .img-choice.selected { border-color: var(--primary); background: var(--glass); }

        .save-btn { width: 100%; padding: 18px; background: var(--primary); border: none; border-radius: 20px; font-weight: 800; cursor: pointer; margin-top: 20px; color: #000; transition: 0.2s; }
    </style>
</head>
<body onmouseleave="resetMagnet()">

    <div class="profile-pill" onclick="toggleModal('settingsModal', true)">
        <img id="userImg" src="https://via.placeholder.com/150" class="profile-img">
        <span id="userName" class="profile-name">Dzey Autajay</span>
    </div>

    <div class="top-nav">
        <button class="top-btn" onclick="resetFocus()"><i data-lucide="refresh-cw"></i></button>
        <button class="top-btn" onclick="toggleModal('srModal', true)"><i data-lucide="user-check"></i></button>
        <button class="top-btn" onclick="nextFocus()"><i data-lucide="chevron-down"></i></button>
    </div>

    <div class="container" id="mainContainer">
        <div id="highlighter"></div>
        
        <h2>DISCOUNT</h2>
        <div class="item-row" data-val="H-DISCOUNT"><span class="text-content">H-DISCOUNT</span></div>

        <h2>ACCOUNT</h2>
        <div class="item-row" data-val="110098112460"><span class="text-content">110098112460</span></div>

        <h2>Laboratory</h2>
        <div class="item-row" data-val="CHEMISTRY: FBS"><span class="text-content">CHEMISTRY: FBS</span></div>
        <div class="item-row" data-val="CHEMISTRY: URIC ACID"><span class="text-content">CHEMISTRY: URIC ACID</span></div>
        <div class="item-row" data-val="HEMATOLOGY: CBC"><span class="text-content">HEMATOLOGY: CBC</span></div>
        <div class="add-btn-circle" onclick="alert('Library logic here')"><i data-lucide="plus"></i></div>

        <h2>Supplies</h2>
        <div class="item-row" data-val="IV CATHETER G. 20"><span class="text-content">IV CATHETER G. 20</span></div>
        <div class="item-row" data-val="IV CATHETER G. 24"><span class="text-content">IV CATHETER G. 24</span></div>
        <div class="item-row" data-val="MICROSET"><span class="text-content">MICROSET</span></div>
        <div class="item-row" data-val="MACROSET"><span class="text-content">MACROSET</span></div>
        <div class="add-btn-circle" onclick="alert('Library logic here')"><i data-lucide="plus"></i></div>
    </div>

    <div class="bottom-zone" onclick="copyFocusedItem()">
        <button class="btn-main-copy" id="magnetBtn"></button>
    </div>

    <div class="modal-overlay" id="srModal" onclick="closeOutside(event, 'srModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>DISCOUNT CALCULATOR</h3>
            <div class="input-group"><label>CHARGES</label><input id="hospCharges" type="number" oninput="calcSr()"></div>
            <div class="input-group"><label>PHIC</label><input id="caseRate" type="number" oninput="calcSr()"></div>
            <div style="font-size: 2.8rem; font-weight: 800; color: var(--primary);" id="finalDiscount">0.00</div>
            <button class="save-btn" onclick="copyModalValue()">COPY RESULT</button>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal" onclick="closeOutside(event, 'settingsModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="color: var(--primary);">SETTINGS</h3>
            <div class="input-group"><label>NAME</label><input id="set-name" type="text"></div>
            <div class="input-group"><label>HUE</label><div class="slider-wrap"><input type="range" min="0" max="360" class="color-slider" id="huePrimary" oninput="applyLiveTheme()"></div></div>
            <div class="input-group"><label>DARKNESS</label><div class="slider-wrap"><input type="range" min="0" max="100" class="color-slider" id="hueBG" oninput="applyLiveTheme()"></div></div>
            <div class="img-grid" id="imageGrid"></div>
            <button class="save-btn" onclick="saveSettings()">SAVE CHANGES</button>
        </div>
    </div>

    <script>
        let currentFocusedIndex = 0;
        let selectedImg = "https://sklepagatesting.github.io/resources/Images/mclaren.png";
        const allRows = document.querySelectorAll('.item-row');

        window.onload = () => {
            loadSettings();
            initImgGrid();
            updateFocus(0);
            lucide.createIcons();
            allRows.forEach((row, idx) => row.onclick = () => executeCopy(row, idx));
        };

        function loadSettings() {
            const saved = localStorage.getItem('eSOASettings_Pro');
            if (saved) {
                const s = JSON.parse(saved);
                document.getElementById('userName').innerText = s.name;
                document.getElementById('set-name').value = s.name;
                document.getElementById('huePrimary').value = s.hueP;
                document.getElementById('hueBG').value = s.hueB;
                selectedImg = s.btn;
            }
            document.getElementById('magnetBtn').style.backgroundImage = `url('${selectedImg}')`;
            applyLiveTheme();
        }

        function applyLiveTheme() {
            const hP = document.getElementById('huePrimary').value;
            const hB = document.getElementById('hueBG').value;
            document.documentElement.style.setProperty('--primary-hue', hP);
            document.documentElement.style.setProperty('--bg-hue', hB);
            document.documentElement.style.setProperty('--surface-hue', hB);
        }

        function saveSettings() {
            const data = {
                name: document.getElementById('set-name').value,
                hueP: document.getElementById('huePrimary').value,
                hueB: document.getElementById('hueBG').value,
                btn: selectedImg
            };
            localStorage.setItem('eSOASettings_Pro', JSON.stringify(data));
            document.getElementById('userName').innerText = data.name;
            document.getElementById('magnetBtn').style.backgroundImage = `url('${selectedImg}')`;
            toggleModal('settingsModal', false);
            flashMagnet();
        }

        function initImgGrid() {
            const grid = document.getElementById('imageGrid');
            for(let i=1; i<=8; i++) {
                const url = `https://sklepagatesting.github.io/resources/Images/${i}.png`;
                const img = document.createElement('img');
                img.src = url; img.className = 'img-choice';
                if(url === selectedImg) img.classList.add('selected');
                img.onclick = () => {
                    document.querySelectorAll('.img-choice').forEach(el => el.classList.remove('selected'));
                    img.classList.add('selected');
                    selectedImg = url;
                };
                grid.appendChild(img);
            }
        }

        function executeCopy(row, index) {
            const text = row.getAttribute('data-val');
            navigator.clipboard.writeText(text).then(() => {
                document.querySelectorAll('.text-content').forEach(el => el.classList.remove('text-active'));
                row.querySelector('.text-content').classList.add('text-active');
                flashMagnet();
                updateFocus(index);
                // Auto-advance logic
                let nextIdx = (index + 1) % allRows.length;
                if(text.includes("G. 20")) nextIdx = Array.from(allRows).findIndex(r => r.innerText.includes("MACROSET"));
                if(text.includes("G. 24")) nextIdx = Array.from(allRows).findIndex(r => r.innerText.includes("MICROSET"));
                setTimeout(() => updateFocus(nextIdx), 400);
            });
        }

        function flashMagnet() {
            const btn = document.getElementById('magnetBtn');
            btn.classList.add('success-state');
            document.body.classList.add('copy-flash');
            setTimeout(() => {
                btn.classList.remove('success-state');
                document.body.classList.remove('copy-flash');
            }, 500);
        }

        function updateFocus(index) {
            currentFocusedIndex = index;
            const targetRow = allRows[index];
            const highlighter = document.getElementById('highlighter');
            const containerRect = document.getElementById('mainContainer').getBoundingClientRect();
            const rect = targetRow.getBoundingClientRect();
            highlighter.style.opacity = "1";
            highlighter.style.top = (rect.top - containerRect.top) + "px";
            highlighter.style.height = rect.height + "px";
            targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function copyFocusedItem() { executeCopy(allRows[currentFocusedIndex], currentFocusedIndex); }
        function nextFocus() { updateFocus((currentFocusedIndex + 1) % allRows.length); }
        function resetFocus() { updateFocus(0); }

        function toggleModal(id, show) {
            const m = document.getElementById(id);
            if(show) { m.style.display = 'flex'; setTimeout(() => m.classList.add('active'), 10); }
            else { m.classList.remove('active'); setTimeout(() => m.style.display = 'none', 300); }
        }

        function closeOutside(e, id) { if(e.target.id === id) toggleModal(id, false); }

        function calcSr() {
            const c = parseFloat(document.getElementById('hospCharges').value) || 0;
            const r = parseFloat(document.getElementById('caseRate').value) || 0;
            document.getElementById('finalDiscount').innerText = (c - ((c * 0.20) + r)).toFixed(2);
        }

        function copyModalValue() {
            navigator.clipboard.writeText(document.getElementById('finalDiscount').innerText);
            toggleModal('srModal', false); flashMagnet();
        }

        document.addEventListener('mousemove', (e) => {
            const btn = document.getElementById('magnetBtn');
            if(e.clientY > window.innerHeight * 0.7) {
                const x = (e.clientX - window.innerWidth / 2) * 0.15;
                const y = (e.clientY - (window.innerHeight - 100)) * 0.15;
                btn.style.transform = `translate(${x}px, ${y}px)`;
                btn.classList.remove('idle');
            } else {
                btn.style.transform = `translate(0,0)`;
                btn.classList.add('idle');
            }
        });
    </script>
</body>
</html>
