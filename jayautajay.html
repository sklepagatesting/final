<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Loving Memory</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#f5f5f5;
    font-family:'Georgia', serif;
    overflow-x:hidden;
}

/* MAIN WRAPPER */
.memorial-container{
    width:100%;
}

/* HERO */
.hero-section{
    position:relative;
    width:100%;
    height:clamp(60vh, 78vh, 85vh);
    background:#070707;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* IMAGE */
.memorial-image{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    filter: grayscale(70%) brightness(1.05);
}

/* GRADIENT OVERLAY */
.hero-section::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:25%;
    background:linear-gradient(
        to bottom,
        rgba(5,5,5,0) 0%,
        rgba(5,5,5,0.25) 40%,
        rgba(5,5,5,0.7) 75%,
        #050505 100%
    );
    pointer-events:none;
}

/* CONTENT */
.content{
    width:100%;
    max-width:850px;
    margin:0 auto;
    padding:60px 24px 100px;
    text-align:center;
}

/* NAME */
.name{
    font-size:clamp(2rem, 5vw, 4.2rem);
    font-weight:700;
    color:#fff;
    margin-bottom:10px;
}

/* YEARS */
.years{
    font-size:1.1rem;
    color:#b8b8b8;
    letter-spacing:3px;
    margin-bottom:40px;
}

/* TEXT */
.tribute-text{
    font-size:1.1rem;
    line-height:2;
    color:#d4d4d4;
    text-align:justify;
}

/* MOBILE */
@media (max-width: 900px){

    .hero-section{
        height:95vh;
    }

    .memorial-image{
        object-fit:cover;
        object-position:50% 30%;
        margin-top: 30px;
    }

    .content{
        padding:0px 40px 100px;

        /* ensures clean separation */
        min-height:25vh;
    }

    .tribute-text{
        font-size:1rem;
        line-height:1.85;

    }
}

/* SMALL PHONES */
@media (max-width: 480px){

    .hero-section{
        height:65vh;
    }

    .years{
        letter-spacing:2px;
    }
}
</style>
</head>

<body>

<div class="memorial-container">

    <!-- HERO -->
    <div class="hero-section">
        <img class="memorial-image"
             src="https://sklepagatesting.github.io/resources/Images/jayautajay.png"
             alt="In Loving Memory">
    </div>

    <!-- CONTENT -->
    <div class="content">
        <h1 class="name">Jay D. Autajay</h1>
        <div class="years">2003 – </div>

        <p class="tribute-text">
            A common form of Lorem ipsum reads: Lorem ipsum dolor sit amet,
            consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore
            et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation
            ullamco laboris nisi ut aliquip ex ea commodo consequat.
        </p>
    </div>

</div>

</body>
</html>
