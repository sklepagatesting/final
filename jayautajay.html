<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Loving Memory</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#070707;
    color:#f5f5f5;
    font-family:'Georgia', serif;
    overflow-x:hidden;
}

/* =========================
   MAIN CONTAINER
========================= */
.memorial-container{
    width:100%;
    min-height:100vh;
    background:#070707;
}

/* =========================
   HERO SECTION
========================= */
.hero-section{
    position:relative;
    width:100%;

    /* desktop image height */
    height:83vh;
    min-height:620px;
    max-height:920px;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    overflow:hidden;
    background:#070707;

    transition:height .35s ease;
}

/* IMAGE */
.memorial-image{
    width:100%;
    height:100%;

    /* DESKTOP = FULL IMAGE */
    object-fit:contain;

    /* stable positioning */
    object-position:center bottom;

    filter:grayscale(70%) brightness(1.05);

    transition:
        object-position .35s ease,
        transform .35s ease,
        height .35s ease;
}

/* SMOOTH FADE */
.hero-section::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:28%;

    background:linear-gradient(
        to bottom,
        rgba(7,7,7,0) 0%,
        rgba(7,7,7,0.15) 35%,
        rgba(7,7,7,0.55) 72%,
        #070707 100%
    );

    pointer-events:none;
}

/* =========================
   CONTENT
========================= */
.content{
    width:min(100%, 900px);

    margin:0 auto;

    padding:
        clamp(14px, 2vw, 24px)
        clamp(22px, 5vw, 48px)
        clamp(80px, 10vw, 130px);

    text-align:center;

    transition:padding .35s ease;
}

/* NAME */
.name{
    font-size:clamp(2.2rem, 5vw, 4.5rem);
    line-height:1.08;
    font-weight:700;
    color:#ffffff;

    margin-bottom:14px;

    transition:
        font-size .35s ease,
        margin .35s ease;
}

/* YEARS */
.years{
    font-size:clamp(.95rem, 1.5vw, 1.15rem);
    color:#b8b8b8;

    letter-spacing:clamp(2px, .35vw, 4px);

    margin-bottom:clamp(28px, 5vw, 46px);

    transition:
        font-size .35s ease,
        letter-spacing .35s ease,
        margin .35s ease;
}

/* PARAGRAPH */
.tribute-text{
    font-size:clamp(1rem, 1.35vw, 1.12rem);

    text-align:justify;
    text-wrap:pretty;

    line-height:clamp(1.8, 2vw, 2);

    color:#d2d2d2;

    transition:
        font-size .35s ease,
        line-height .35s ease;
}

/* =========================
   TABLET
========================= */
@media (max-width:900px){

    .hero-section{
        height:90vh;
        min-height:800px;
    }

    .memorial-image{
        /* mobile can crop smoothly */
        object-fit:cover;
    }
}

/* =========================
   MOBILE
========================= */
@media (max-width:600px){

    .hero-section{
        height:85vh;
        min-height:700px;
    }

    .content{
        padding-left:24px;
        padding-right:24px;
    }

    .tribute-text{
        font-size:1rem;
    }
}

/* =========================
   SMALL PHONE
========================= */
@media (max-width:420px){

    .hero-section{
        height:62vh;
        min-height:430px;
    }

    .memorial-image{
        object-position:center 10%;
    }

    .years{
        letter-spacing:2px;
    }
}
</style>
</head>

<body>

<div class="memorial-container">

    <!-- HERO -->
    <section class="hero-section">

        <img
            class="memorial-image"
            src="https://sklepagatesting.github.io/resources/Images/jayautajay.png"
            alt="In Loving Memory"
        >

    </section>

    <!-- CONTENT -->
    <section class="content">

        <h1 class="name">
            Jay D. Autajay
        </h1>

        <div class="years">
            2003 –
        </div>

        <p class="tribute-text">
            A common form of Lorem ipsum reads: Lorem ipsum dolor sit amet,
            consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore
            et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation
            ullamco laboris nisi ut aliquip ex ea commodo consequat.
        </p>

    </section>

</div>

</body>
</html>
